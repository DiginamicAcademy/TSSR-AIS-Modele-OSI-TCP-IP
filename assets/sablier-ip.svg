<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <title>Le sablier de TCP/IP</title>
  <desc>Cinq protocoles d'application reposent sur TCP ou UDP, qui reposent tous deux sur IP. IP fonctionne à son tour sur quatre supports : Ethernet, Wi-Fi, fibre, 4G ou 5G. IP est le point de passage unique entre les applications et les supports.</desc>

  <!-- Silhouette du sablier -->
  <path d="M225 14 H975 C975 190 680 240 680 318 C680 396 975 430 975 490 H225 C225 430 510 396 510 318 C510 240 225 190 225 14 Z" fill="#888" fill-opacity="0.13"/>

  <!-- Nom des couches -->
  <g fill="#888" font-weight="700" font-size="18" text-anchor="end">
    <text x="200" y="64">Application</text>
    <text x="200" y="194">Transport</text>
    <text x="200" y="324">Internet</text>
    <text x="200" y="454">Accès réseau</text>
  </g>

  <!-- Liaisons -->
  <g stroke="#888" stroke-width="2.5" stroke-linecap="round">
    <line x1="319" y1="86" x2="500" y2="160"/>
    <line x1="457" y1="86" x2="500" y2="160"/>
    <line x1="595" y1="86" x2="500" y2="160"/>
    <line x1="733" y1="86" x2="690" y2="160"/>
    <line x1="871" y1="86" x2="690" y2="160"/>
    <line x1="500" y1="216" x2="595" y2="290"/>
    <line x1="690" y1="216" x2="595" y2="290"/>
    <line x1="595" y1="346" x2="349" y2="420"/>
    <line x1="595" y1="346" x2="513" y2="420"/>
    <line x1="595" y1="346" x2="677" y2="420"/>
    <line x1="595" y1="346" x2="841" y2="420"/>
  </g>

  <!-- Application -->
  <g fill="#7b3fa0">
    <rect x="260" y="30" width="118" height="56" rx="8"/>
    <rect x="398" y="30" width="118" height="56" rx="8"/>
    <rect x="536" y="30" width="118" height="56" rx="8"/>
    <rect x="674" y="30" width="118" height="56" rx="8"/>
    <rect x="812" y="30" width="118" height="56" rx="8"/>
  </g>
  <g fill="#fff" font-weight="700" font-size="19" text-anchor="middle">
    <text x="319" y="65">HTTP(S)</text>
    <text x="457" y="65">SSH</text>
    <text x="595" y="65">SMTP</text>
    <text x="733" y="65">DNS</text>
    <text x="871" y="65">DHCP</text>
  </g>

  <!-- Transport -->
  <rect x="440" y="160" width="120" height="56" rx="8" fill="#1b7a63"/>
  <rect x="630" y="160" width="120" height="56" rx="8" fill="#1b7a63"/>
  <g fill="#fff" font-weight="700" font-size="20" text-anchor="middle">
    <text x="500" y="195">TCP</text>
    <text x="690" y="195">UDP</text>
  </g>

  <!-- Internet -->
  <rect x="540" y="290" width="110" height="56" rx="8" fill="#347a2f"/>
  <text x="595" y="326" fill="#fff" font-weight="700" font-size="22" text-anchor="middle">IP</text>
  <text x="700" y="324" fill="#888" font-size="17" font-style="italic">un seul protocole</text>

  <!-- Accès réseau -->
  <g fill="#b8621b">
    <rect x="279" y="420" width="140" height="56" rx="8"/>
    <rect x="443" y="420" width="140" height="56" rx="8"/>
    <rect x="607" y="420" width="140" height="56" rx="8"/>
    <rect x="771" y="420" width="140" height="56" rx="8"/>
  </g>
  <g fill="#fff" font-weight="700" font-size="19" text-anchor="middle">
    <text x="349" y="455">Ethernet</text>
    <text x="513" y="455">Wi-Fi</text>
    <text x="677" y="455">Fibre</text>
    <text x="841" y="455">4G / 5G</text>
  </g>
</svg>
